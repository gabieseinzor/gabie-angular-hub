<header class="navbar bg-base-100 shadow-sm px-8">
  <div class="flex-1">
    <a routerLink="/" class="btn btn-ghost text-xl font-bold">
      Gabie<span class="text-primary">.ng</span>
    </a>
  </div>

  <nav class="flex items-center gap-1">
    <a
      routerLink="/"
      routerLinkActive="text-primary"
      [routerLinkActiveOptions]="{ exact: true }"
      class="btn btn-ghost"
      >Accueil</a
    >

    <!-- Lessons -->
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost">Lessons</div>
      <ul
        tabindex="0"
        class="dropdown-content menu bg-base-100 rounded-box z-10 w-56 p-2 shadow"
        (click)="closeMenu()"
      >
        <li>
          <a routerLink="/text-interpolation-lesson" routerLinkActive="menu-active"
            >Interpolation de texte</a
          >
        </li>
        <li>
          <a routerLink="/event-binding-lesson" routerLinkActive="menu-active">Event binding</a>
        </li>
        <li>
          <a routerLink="/attributes-binding-lesson" routerLinkActive="menu-active"
            >Property et attribute binding</a
          >
        </li>
        <li>
          <a routerLink="/conditional-rendering-lesson" routerLinkActive="menu-active"
            >Rendu conditionnel</a
          >
        </li>
        <li>
          <a routerLink="/two-way-binding-lesson" routerLinkActive="menu-active">Two-way binding</a>
        </li>
      </ul>
    </div>

    <!-- Exercices -->
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost">Exercices</div>
      <ul
        tabindex="0"
        class="dropdown-content menu bg-base-100 rounded-box z-10 w-56 p-2 shadow"
        (click)="closeMenu()"
      >
        <li>
          <a routerLink="/text-interpolation-exercise" routerLinkActive="menu-active"
            >Interpolation de texte</a
          >
        </li>
        <li>
          <a routerLink="/observable-simple-exercise" routerLinkActive="menu-active"
            >Observables simples</a
          >
        </li>
        <li><a routerLink="/counter-exercise" routerLinkActive="menu-active">Compteur</a></li>
        <li><a routerLink="/todo-exercise" routerLinkActive="menu-active">Liste de tâches</a></li>
        <li>
          <a routerLink="/api-httpclient-exercice" routerLinkActive="menu-active">API HttpClient</a>
        </li>
        <li>
          <a routerLink="/http-api" routerLinkActive="menu-active">Météo (Service + API)</a>
        </li>
      </ul>
    </div>

    <!-- TP -->
    <div class="dropdown dropdown-end">
      <div tabindex="0" role="button" class="btn btn-ghost">TP</div>
      <ul
        tabindex="0"
        class="dropdown-content menu bg-base-100 rounded-box z-10 w-56 p-2 shadow"
        (click)="closeMenu()"
      >
        <!-- <li>
          <a routerLink="/tp/tp-1" routerLinkActive="menu-active">TP 1</a>
        </li> -->
      </ul>
    </div>

    <a routerLink="/about" routerLinkActive="text-primary" class="btn btn-ghost">À propos</a>
  </nav>
</header>
