<section class="max-w-2xl mx-auto my-10 p-4 space-y-6">
  <header class="text-center space-y-1">
    <h1 class="text-3xl font-bold text-primary">Générateur simplifié de nombres aléatoires</h1>
  </header>

  <!-- Boutons -->
  <div class="flex flex-wrap justify-center gap-3">
    <button class="btn btn-success" (click)="start()" [disabled]="paused()">Démarrer</button>
    <!-- Le libellé change : "Pause" ou "Reprendre" -->
    <button class="btn btn-warning" (click)="pauseResume()" [disabled]="numbers().length === 0">
      {{ paused() ? 'Reprendre' : 'Pause' }}
    </button>
    <button class="btn btn-error" (click)="stop()">Arrêter</button>
  </div>

  <!-- Liste des nombres -->
  <article class="card bg-base-100 shadow-md border border-base-300">
    <div class="card-body gap-4">
      <h2 class="card-title text-secondary">Nombres générés</h2>

      <ul class="space-y-2">
        @for (number of numbers(); track $index) {
          <li class="rounded-box bg-base-200 p-3 text-center font-mono font-bold text-primary">
            {{ number }}
          </li>
        } @empty {
          <li class="py-6 text-center text-sm italic text-base-content/50">
            Aucun nombre généré pour l'instant.
          </li>
        }
      </ul>
    </div>
  </article>
</section>
